<script>
  // Apply a stored theme choice before first paint. Shares the "theme" key with the rest of the site.
  (function () { try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>

<style>
:root {
  --bg: #0a0e13; --fg: #f3f1ec; --muted: #9aa3ad; --text-soft: #d9d6cf;
  --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.09); --hover-line: rgba(255,255,255,0.3);
  --card-fill: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
  --shadow-1: 0 1px 0 rgba(255,255,255,0.06) inset, 0 8px 24px -12px rgba(0,0,0,0.6);
  --btn-depth: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 rgba(0,0,0,0.25);
  --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* Election palette: the site's dusty pastels, tuned to blue, red, and purple. */
  --dem: #8fb4e3; --gop: #e39a97; --ind: #b3a3e6; --other: #9aa3ad;
  --dem-fill: #8fb4e3; --gop-fill: #e39a97; --ind-fill: #b3a3e6;
  --accent: var(--dem); --accent-2: var(--gop); --c: var(--ind);
  --grad: linear-gradient(120deg, #8fb4e3, #b3a3e6 55%, #e39a97);
  --shadow-2: 0 20px 60px -24px rgba(179,163,230,0.5);
  --well: #10151c; --ink: #0a0e13; --track: rgba(255,255,255,0.08); --row: rgba(255,255,255,0.03);
  --spot: rgba(255,255,255,0.06); --aurora-k: 1; --glass: rgba(10,14,19,0.9);
  --next-row: rgba(143,180,227,0.1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f3ec; --fg: #15181d; --muted: #5d6670; --text-soft: #15181d;
  --card: rgba(255,255,255,0.65); --border: rgba(21,24,29,0.10); --hover-line: rgba(21,24,29,0.3);
  --card-fill: linear-gradient(160deg, rgba(21,24,29,0.07), rgba(21,24,29,0.02));
  --dem: #365f86; --gop: #a0474d; --ind: #5a4a9e; --other: #5d6670;
  --well: #eae6dd; --track: rgba(21,24,29,0.1); --row: rgba(21,24,29,0.03);
  --spot: rgba(10,14,19,0.05); --aurora-k: 0.5; --glass: rgba(246,243,236,0.92);
  --next-row: rgba(54,95,134,0.1);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f3ec; --fg: #15181d; --muted: #5d6670; --text-soft: #15181d;
    --card: rgba(255,255,255,0.65); --border: rgba(21,24,29,0.10); --hover-line: rgba(21,24,29,0.3);
    --card-fill: linear-gradient(160deg, rgba(21,24,29,0.07), rgba(21,24,29,0.02));
    --dem: #365f86; --gop: #a0474d; --ind: #5a4a9e; --other: #5d6670;
    --well: #eae6dd; --track: rgba(21,24,29,0.1); --row: rgba(21,24,29,0.03);
    --spot: rgba(10,14,19,0.05); --aurora-k: 0.5; --glass: rgba(246,243,236,0.92);
    --next-row: rgba(54,95,134,0.1);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 0.95rem/1.55 var(--sans); overflow-x: clip; min-height: 100vh; transition: background 0.3s, color 0.3s; }
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; border-radius: 6px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ---------- background ---------- */
.aurora { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
.blob { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: calc(0.34 * var(--aurora-k)); animation: drift 24s ease-in-out infinite alternate; }
.b1 { background: #3f5f94; top: -20vmax; left: -15vmax; }
.b2 { background: #8f4a4e; bottom: -25vmax; right: -15vmax; animation-duration: 30s; animation-delay: -8s; opacity: calc(0.3 * var(--aurora-k)); }
.b3 { background: #5a4a9e; top: 30vh; left: 40vw; width: 38vmax; height: 38vmax; animation-duration: 36s; animation-delay: -15s; opacity: calc(0.22 * var(--aurora-k)); }
@keyframes drift { to { transform: translate(12vmax, 8vmax) scale(1.2) rotate(30deg); } }
.spotlight { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(520px circle at var(--mx, 50%) var(--my, 30%), var(--spot), transparent 60%); }

/* ---------- header ---------- */
.site-header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 0.8rem 1.2rem; flex-wrap: wrap; padding: 0.7rem max(1rem, 2vw); }
.site-header::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(var(--bg) 40%, transparent); backdrop-filter: blur(8px); mask-image: linear-gradient(#000 60%, transparent); }
.brand { display: flex; align-items: center; gap: 0.9rem; padding: 0.28rem; }
.brand img { display: block; height: 1.35rem; width: auto; }
:root[data-theme="light"] .brand .wm-dark, :root:not([data-theme]) .brand .wm-light { display: none; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .brand .wm-dark { display: none; } :root:not([data-theme="dark"]) .brand .wm-light { display: block; } }
:root[data-theme="dark"] .brand .wm-light { display: none; } :root[data-theme="dark"] .brand .wm-dark { display: block; }
.brand .title { font-family: var(--serif); font-weight: 400; font-size: 1.25rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--gop); box-shadow: 0 0 0 0 rgba(227,154,151,0.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(227,154,151,0); } 100% { box-shadow: 0 0 0 0 rgba(227,154,151,0); } }
nav.primary { display: flex; gap: 0.15rem; flex-wrap: wrap; position: relative; }
nav.primary button { position: relative; background: none; border: 1px solid transparent; padding: 0.38rem 0.85rem; border-radius: 999px; color: var(--muted); cursor: pointer; font-weight: 500; font-size: 0.88rem; transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.2s; }
nav.primary button:hover { color: var(--fg); transform: translateY(-1px); }
nav.primary button[aria-current="page"] { background: var(--card); border-color: var(--border); color: var(--fg); }
nav.primary button .badge { position: absolute; top: -2px; right: 2px; min-width: 1.1rem; height: 1.1rem; padding: 0 0.3rem; border-radius: 999px; background: var(--gop); color: var(--ink); font-size: 0.62rem; font-weight: 600; display: grid; place-items: center; animation: pop 0.4s ease; }
@keyframes pop { from { transform: scale(0); } 60% { transform: scale(1.25); } to { transform: scale(1); } }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.clock { display: flex; gap: 0.9rem; color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.clock b { color: var(--fg); font-weight: 500; }
.clock small { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; margin-right: 0.3rem; }
.iconbtn { display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; font-size: 0.82rem; font-weight: 500; color: var(--muted); padding: 0.35rem 0.75rem; border-radius: 999px; border: 1px solid var(--border); background: var(--card); transition: color 0.2s, border-color 0.2s, transform 0.2s; }
.iconbtn:hover { color: var(--fg); border-color: var(--hover-line); transform: translateY(-1px); }
.iconbtn[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
.ico { width: 1em; height: 1em; flex: none; vertical-align: -0.12em; }

main { padding: 0.9rem max(1rem, 2vw) 3rem; }
.wrap { width: min(100%, 92rem); margin-inline: auto; }
h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.6rem, 3.5vw, 2.1rem); letter-spacing: -0.02em; margin: 0.4rem 0 0.3rem; }
h2 .num { font-family: var(--sans); font-size: 0.78rem; color: var(--accent); font-weight: 600; letter-spacing: 0.1em; vertical-align: super; margin-right: 0.6rem; }
h3 { font-family: var(--serif); font-weight: 600; font-size: 1.15rem; letter-spacing: -0.02em; margin: 0 0 0.6rem; }
.lead { color: var(--muted); margin: 0 0 1.2rem; max-width: 54rem; }
.lead a, .note a, .small a { color: var(--accent); }
.tag { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-2); font-weight: 600; }
.viewhead { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
.viewhead .lead { margin: 0; flex: 1 1 24rem; }
.viewhead[hidden] { display: none; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.55rem 1.1rem; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; white-space: nowrap; }
.btn:hover { transform: translateY(-2px); border-color: var(--hover-line); }
.btn:disabled { opacity: 0.4; cursor: default; transform: none; }
.btn.primary { background: var(--grad); border-color: transparent; color: var(--ink); box-shadow: var(--btn-depth); }
.btn.primary:hover { box-shadow: var(--btn-depth), var(--shadow-2); }
.btn.sm { padding: 0.3rem 0.75rem; font-size: 0.8rem; }
.btn.danger:hover { border-color: var(--gop); }
.filter { font-size: 0.88rem; font-weight: 500; cursor: pointer; padding: 0.4rem 0.95rem; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); transition: color 0.2s, border-color 0.2s, background 0.2s; }
.filter:hover { color: var(--fg); border-color: var(--hover-line); }
.filter[aria-pressed="true"] { color: var(--ink); background: var(--dem-fill); border-color: transparent; }
.filters { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0 0 1.2rem; }
input[type=text], input[type=number], input[type=url], input[type=date], textarea, select { background: var(--card); border: 1px solid var(--border); border-radius: 0.7rem; padding: 0.55rem 0.8rem; width: 100%; color: var(--fg); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.7; }
textarea { resize: vertical; min-height: 4.4rem; font-size: 0.85rem; line-height: 1.5; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--c); outline-offset: -1px; border-color: transparent; }
label.f { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0.9rem 0 0.35rem; }
label.f:first-child { margin-top: 0; }
.row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.spacer { flex: 1; }
.card { background: var(--card-fill); border: 1px solid var(--border); border-radius: 1.2rem; box-shadow: var(--shadow-1); padding: 1.3rem; backdrop-filter: blur(10px); }
.grid-forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 1rem; }
.note { font-size: 0.84rem; color: var(--muted); border: 1px dashed var(--border); border-radius: 0.9rem; padding: 0.7rem 0.95rem; margin-top: 1rem; }
.note b { color: var(--text-soft); font-weight: 600; }
code { font-family: inherit; font-size: 0.9em; padding: 0.05em 0.4em; border-radius: 0.35rem; background: var(--track); }
.err { color: var(--gop); }
.small { font-size: 0.8rem; color: var(--muted); }
input[type=checkbox] { width: 1rem; height: 1rem; accent-color: #8fb4e3; }
.findlist { display: grid; gap: 0.35rem; margin-top: 0.6rem; max-height: 26rem; overflow: auto; }
.findrow { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: 0.8rem; background: var(--row); }
.findrow > div { flex: 1; min-width: 0; display: grid; gap: 0.1rem; }
.findrow b { font-weight: 600; font-size: 0.88rem; }
.findrow .small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- stage and panels ---------- */
.stage { display: grid; gap: 0.75rem; grid-auto-flow: dense; }
.stage[hidden] { display: none; }
.stage.v-dashboard { grid-template-columns: repeat(var(--cols, 3), 1fr); grid-auto-rows: var(--rowh, 240px); }
.stage.v-dashboard .panel { min-height: 0; }
.stage.v-streams { grid-template-columns: repeat(auto-fill, minmax(min(100%, 26rem), 1fr)); }
.stage.v-streams .panel { aspect-ratio: 16 / 10; }
.stage.v-browsers { grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); }
.stage.v-browsers .panel { height: calc(100vh - 12rem); min-height: 28rem; }
.stage.v-results .panel, .stage.v-wire .panel { min-height: calc(100vh - 12rem); }
.stage.v-tools { grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); align-items: start; }
.stage.v-tools .panel { min-height: 24rem; height: calc(100vh - 12rem); }
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--card-fill); border: 1px solid var(--border); border-radius: 1rem; box-shadow: var(--shadow-1); overflow: hidden; transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s; }
.panel[hidden] { display: none; }
.panel:hover { border-color: var(--hover-line); }
.panel.enter { animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(0.985); } }
.ph { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.6rem 0.45rem 0.85rem; border-bottom: 1px solid var(--border); background: var(--row); font-weight: 600; font-size: 0.85rem; cursor: default; }
.ph .ico.kind { color: var(--accent); }
.ph .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph .acts { display: flex; gap: 0.1rem; }
.ph .acts a, .ph .acts button { display: grid; place-items: center; width: 1.7rem; height: 1.7rem; color: var(--muted); background: none; border: 0; border-radius: 999px; cursor: pointer; transition: color 0.2s, background 0.2s, transform 0.2s; }
.ph .acts a:hover, .ph .acts button:hover { color: var(--fg); background: var(--track); transform: scale(1.1); }
.ph .acts button[aria-pressed="true"] { color: var(--accent); }
.ph .acts button[hidden] { display: none; }
.ph .acts button.spin .ico { animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pb { flex: 1; position: relative; min-height: 0; background: var(--well); }
.pb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.pb.video iframe { background: #000; }
.pb.scroll { overflow: auto; background: transparent; overscroll-behavior: contain; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 0.86rem; text-align: center; padding: 1.4rem; line-height: 1.5; }
.empty .btn { margin-top: 0.4rem; }
.urlbar { display: flex; gap: 0.4rem; padding: 0.4rem; border-bottom: 1px solid var(--border); }
.urlbar input { padding: 0.35rem 0.7rem; font-size: 0.82rem; border-radius: 999px; }
.urlbar .btn { padding: 0.3rem 0.8rem; }
.bookmarks { display: flex; gap: 0.35rem; padding: 0.35rem 0.5rem; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
.bookmarks::-webkit-scrollbar { display: none; }
.bookmarks button { flex: none; font-size: 0.74rem; padding: 0.2rem 0.6rem; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; transition: color 0.2s, border-color 0.2s, transform 0.2s; }
.bookmarks button:hover { color: var(--fg); border-color: var(--accent); transform: translateY(-1px); }
.panel { position: relative; }
.panel .rz { position: absolute; z-index: 3; display: none; touch-action: none; }
.stage.v-dashboard .panel:not(.mini):not(.focused) .rz { display: block; }
.rz-e { right: -4px; top: 0; bottom: 0; width: 9px; cursor: ew-resize; }
.rz-s { bottom: -4px; left: 0; right: 0; height: 9px; cursor: ns-resize; }
.rz-se { right: -4px; bottom: -4px; width: 16px; height: 16px; cursor: nwse-resize; z-index: 4; }
.rz:hover, .rz.on { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.stage.v-dashboard .panel:not(.mini):not(.focused) .ph { cursor: grab; }
.stage.dragging-any .pb, .stage.dragging-any .pb iframe, body.resizing .pb iframe, body.resizing .pb { pointer-events: none; }
.stage.dragging-any .ph { cursor: grabbing !important; }
.panel.dragging { opacity: 0.45; transform: scale(0.98); z-index: 5; }
.panel.over-before { box-shadow: -4px 0 0 0 var(--accent), var(--shadow-1); }
.panel.over-after { box-shadow: 4px 0 0 0 var(--accent), var(--shadow-1); }
.panel.sizing { box-shadow: 0 0 0 2px var(--accent), var(--shadow-2); transition: none; }
.panel.focused { position: fixed; inset: 0; z-index: 40; border-radius: 0; aspect-ratio: auto !important; height: auto !important; animation: zoomin 0.25s ease; }
/* Miniplayer: one stream floats over every section. Position and size are inline. */
.panel.mini { position: fixed; z-index: 45; left: var(--mx, auto); top: var(--my, auto); right: var(--mr, 1rem); bottom: var(--mb, 1rem); width: var(--mw, 26rem); height: var(--mh, 16rem); aspect-ratio: auto !important; box-shadow: 0 30px 80px -24px rgba(0,0,0,0.7), var(--shadow-1); animation: zoomin 0.25s ease; grid-column: auto !important; grid-row: auto !important; order: 0 !important; }
.panel.mini .ph { cursor: grab; }
.panel.mini.moving .ph { cursor: grabbing; }
.panel.mini .rz { display: block; }
.panel.mini .rz-e, .panel.mini .rz-s { display: none; }
.panel.mini .acts [data-a=pop] { color: var(--accent); }
.panel.mini.focused { left: 0 !important; top: 0 !important; right: 0 !important; bottom: 0 !important; width: auto !important; height: auto !important; }
@media (max-width: 48rem) { .panel.mini { --mw: 70vw !important; --mh: 11rem !important; } }
@keyframes zoomin { from { transform: scale(0.97); opacity: 0.6; } }
.panel.focused .ph { padding-top: 0.6rem; padding-bottom: 0.6rem; }
@media (max-width: 48rem) {
  .stage.v-dashboard { grid-template-columns: 1fr !important; grid-auto-rows: auto; }
  .stage.v-dashboard .panel { grid-column: auto !important; grid-row: auto !important; min-height: 18rem; }
  .stage.v-dashboard .panel.tall { min-height: 26rem; }
  .stage.v-browsers .panel, .stage.v-tools .panel { height: 72vh; }
  main { padding-inline: 0.75rem; }
  .site-header { padding-inline: 0.75rem; }
  .clock { display: none; }
}

/* ---------- results ---------- */
.races { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 0.6rem; padding: 0.6rem; }
.race { background: var(--row); border: 1px solid var(--border); border-radius: 0.85rem; padding: 0.75rem 0.85rem; transition: border-color 0.4s, box-shadow 0.4s; }
.race.called { border-color: var(--hover-line); }
.race.flash { animation: flash 1.6s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(179,163,230,0); } 20% { box-shadow: 0 0 0 3px rgba(179,163,230,0.5); } 100% { box-shadow: 0 0 0 0 rgba(179,163,230,0); } }
.race h4 { font-family: var(--serif); font-weight: 600; font-size: 0.98rem; letter-spacing: -0.01em; margin: 0; display: flex; gap: 0.4rem; align-items: flex-start; line-height: 1.25; }
.race h4 span { flex: 1; }
.race h4 .star { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; display: grid; transition: transform 0.2s, color 0.2s; }
.race h4 .star:hover { transform: scale(1.2); }
.race h4 .star[aria-pressed="true"] { color: var(--accent-2); }
.race .meta { font-size: 0.72rem; color: var(--muted); margin: 0.2rem 0 0.5rem; display: flex; gap: 0.7rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.race .meta b { color: var(--text-soft); font-weight: 600; }
.rptbar { height: 3px; background: var(--track); border-radius: 2px; margin: -0.25rem 0 0.6rem; overflow: hidden; }
.rptbar i { display: block; height: 100%; background: var(--ind-fill); transition: width 0.8s ease; }
.cand { margin: 0.35rem 0; }
.cand .top { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.8rem; }
.cand .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cand .nm small { color: var(--muted); font-weight: 400; }
.cand .num { font-variant-numeric: tabular-nums; font-size: 0.76rem; color: var(--muted); white-space: nowrap; }
.cand .num b { color: var(--fg); font-weight: 600; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 0.2rem; }
.bar i { display: block; height: 100%; border-radius: 3px; transition: width 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); }
.win { font-size: 0.64rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--ink); background: var(--fg); border-radius: 999px; padding: 0.05rem 0.4rem; vertical-align: 0.1em; }
:root[data-theme="light"] .win { color: #fff; }
.status { font-size: 0.74rem; color: var(--muted); padding: 0.4rem 0.85rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dem); flex: none; transition: background 0.3s; }
.dot.busy { background: var(--ind); animation: pulse 1s infinite; } .dot.err { background: var(--gop); }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
.chip { display: inline-flex; gap: 0.4rem; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 0.2rem 0.3rem 0.2rem 0.75rem; font-size: 0.82rem; }
.chip button { background: none; border: 0; color: var(--muted); cursor: pointer; display: grid; padding: 0.15rem; border-radius: 999px; }
.chip button:hover { color: var(--gop); }

/* ---------- wire ---------- */
.wirebar { display: flex; gap: 0.4rem; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); align-items: center; overflow-x: auto; scrollbar-width: none; }
.wirebar::-webkit-scrollbar { display: none; }
.wirebar input { padding: 0.3rem 0.7rem; font-size: 0.8rem; border-radius: 999px; min-width: 8rem; flex: 1; }
.wirebar .src { flex: none; font-size: 0.72rem; padding: 0.2rem 0.6rem; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; transition: all 0.2s; }
.wirebar .src[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
.wirebar .src.off { opacity: 0.45; text-decoration: line-through; }
.wire { list-style: none; margin: 0; padding: 0.3rem 0; position: relative; }
.wire li { display: grid; grid-template-columns: 1fr; gap: 0.2rem; padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--border); font-size: 0.86rem; transition: background 0.6s; }
.wire li:last-child { border-bottom: 0; }
.wire li.new { animation: newitem 2.5s ease; }
@keyframes newitem { 0% { background: var(--next-row); transform: translateX(-6px); opacity: 0; } 15% { opacity: 1; transform: none; } 100% { background: transparent; } }
.wire .who { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.72rem; color: var(--muted); }
.wire .who b { color: var(--accent); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.68rem; }
.wire .who time { font-variant-numeric: tabular-nums; }
.wire .who .rp { color: var(--ind); }
.wire .txt { color: var(--text-soft); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
.wire .txt a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 0.15em; }
.wire .ext { display: inline-block; margin-top: 0.15rem; }
.wire .ext a { font-size: 0.74rem; color: var(--muted); }
.wire .ext a:hover { color: var(--fg); }
.wire .imgs { display: flex; gap: 0.3rem; margin-top: 0.3rem; }
.wire .imgs img { height: 5rem; border-radius: 0.5rem; border: 1px solid var(--border); object-fit: cover; }
.newpill { position: sticky; top: 0.4rem; z-index: 2; display: flex; justify-content: center; height: 0; overflow: visible; }
.newpill button { transform: translateY(-0.2rem); background: var(--grad); color: var(--ink); border: 0; border-radius: 999px; padding: 0.25rem 0.8rem; font-size: 0.76rem; font-weight: 600; cursor: pointer; box-shadow: var(--btn-depth), var(--shadow-2); animation: pop 0.3s ease; }
.newpill[hidden] { display: none; }

/* ---------- poll closings ---------- */
.closings { list-style: none; margin: 0; padding: 0.4rem 0; }
.closings li { display: grid; grid-template-columns: 4.6rem 1fr auto; gap: 0.6rem; align-items: start; padding: 0.55rem 0.85rem; border-bottom: 1px solid var(--border); font-size: 0.82rem; transition: opacity 0.6s, background 0.6s; }
.closings li:last-child { border-bottom: 0; }
.closings .tm { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg); }
.closings .st { color: var(--text-soft); line-height: 1.45; }
.closings .cd { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 0.76rem; }
.closings li.past { opacity: 0.45; }
.closings li.next { background: var(--next-row); }
.closings li.next .cd { color: var(--accent); font-weight: 600; }
.closings li.soon .cd { animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.35; } }

/* ---------- balance of power ---------- */
.bop { padding: 0.6rem 0.85rem; display: grid; gap: 0.9rem; }
.chamber { border: 1px solid var(--border); border-radius: 0.85rem; padding: 0.7rem 0.8rem; background: var(--row); }
.chamber h4 { margin: 0 0 0.45rem; font-family: var(--serif); font-weight: 600; font-size: 0.98rem; display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
.chamber h4 small { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.bopbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: 0.7; }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-top: 0.55rem; }
.counts > div { display: grid; gap: 0.15rem; text-align: center; }
.counts label { font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
.counts .dl { color: var(--dem); } .counts .rl { color: var(--gop); } .counts .il { color: var(--ind); }
.counts .n { display: flex; align-items: center; justify-content: center; gap: 0.2rem; }

.counts .n button { width: 1.5rem; height: 1.5rem; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; transition: all 0.15s; }

.log li:last-child { border-bottom: 0; }
.log time { color: var(--accent-2); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; padding-top: 0.15rem; font-variant-numeric: tabular-nums; }
.log .txt { color: var(--text-soft); overflow-wrap: anywhere; }
.log .txt.auto { color: var(--muted); font-style: italic; }
.log button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0.1rem; display: grid; border-radius: 999px; }
.log button:hover { color: var(--gop); }

/* ---------- layout editor ---------- */
.lay-list { display: flex; flex-direction: column; gap: 0.4rem; }
.lay-item { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 0.6rem; align-items: center; background: var(--row); border: 1px solid var(--border); border-radius: 0.8rem; padding: 0.45rem 0.65rem; font-size: 0.88rem; transition: border-color 0.2s, opacity 0.2s; }
.lay-item.off { opacity: 0.45; }
.lay-item.dragging { opacity: 0.3; }
.lay-item.over { border-color: var(--accent); }
.lay-item .handle { cursor: grab; color: var(--muted); display: grid; }
.lay-item select { width: auto; padding: 0.25rem 0.4rem; font-size: 0.8rem; border-radius: 0.5rem; }
.lay-item .ico.kind { color: var(--accent); margin-right: 0.3rem; }
.preview { display: grid; gap: 0.3rem; grid-auto-flow: dense; grid-auto-rows: 2.1rem; margin-top: 0.8rem; }
.preview div { background: var(--track); border: 1px solid var(--border); border-radius: 0.4rem; font-size: 0.68rem; color: var(--muted); display: grid; place-items: center; overflow: hidden; white-space: nowrap; padding: 0 0.3rem; }
.two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 1.2rem; align-items: start; }
@media (max-width: 56rem) { .two { grid-template-columns: 1fr; } }

/* ---------- toasts ---------- */
.toasts { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; display: grid; gap: 0.5rem; max-width: min(24rem, calc(100% - 2rem)); }
.toast { background: var(--glass); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0.8rem; padding: 0.7rem 0.9rem; font-size: 0.86rem; box-shadow: var(--shadow-1); backdrop-filter: blur(8px); animation: toastin 0.45s cubic-bezier(0.2, 0.7, 0.2, 1); }
.toast.call { border-left-color: var(--gop); }
.toast b { display: block; font-family: var(--serif); font-weight: 600; }
.toast.out { animation: toastout 0.4s ease forwards; }
@keyframes toastin { from { opacity: 0; transform: translateY(14px) scale(0.97); } }
@keyframes toastout { to { opacity: 0; transform: translateX(20px); } }
.kbd { font-size: 0.72rem; color: var(--muted); border: 1px solid var(--border); border-radius: 0.35rem; padding: 0 0.35rem; }

footer { width: min(100%, 92rem); margin: 0 auto; padding: 1.5rem max(1rem, 2vw) 2.5rem; color: var(--muted); font-size: 0.8rem; border-top: 1px solid var(--border); display: flex; gap: 1rem 2rem; flex-wrap: wrap; justify-content: space-between; }
footer a { color: var(--accent); }

  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- poll closings ---------- */
function etParts(d) { const f = new Intl.DateTimeFormat('en-US', { timeZone: ET, hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }); const o = {}; f.formatToParts(d).forEach(x => o[x.type] = x.value); return o; }
function closingsPanel() {
  const p = panelShell('closings', { kind: 'i-clock', title: 'Poll closings (ET)' });
  const body = el('<div class="pb scroll"></div>'); p.append(body);
  const list = el('<ul class="closings"></ul>'); body.append(list);
  const items = CLOSINGS.map(([t, ...states]) => {
    const [h, m] = t.split(':').map(Number);
    const label = `${((h % 24) % 12) || 12}:${String(m).padStart(2, '0')} ${h % 24 < 12 ? 'AM' : 'PM'}`;
    const li = el(`<li><span class="tm">${label}</span><span class="st">${states.map(esc).join(', ')}</span><span class="cd"></span></li>`);
    list.append(li); return { h, m, li, cd: $('.cd', li) };
  });
  function tick() {
    const o = etParts(new Date()); const nowMin = (+o.hour % 24) * 60 + +o.minute; const sec = +o.second;
    let nextSet = false;
    items.forEach(it => {
      const diff = (it.h * 60 + it.m) - nowMin;
      it.li.classList.remove('past', 'next', 'soon');
      if (diff <= 0) { it.li.classList.add('past'); it.cd.textContent = 'closed'; }
      else {
        const total = diff * 60 - sec, hh = Math.floor(total / 3600), mm = Math.floor((total % 3600) / 60), ss = total % 60;
        it.cd.textContent = hh ? `${hh}h ${String(mm).padStart(2, '0')}m` : `${mm}m ${String(ss).padStart(2, '0')}s`;
        if (!nextSet) { it.li.classList.add('next'); if (total < 300) it.li.classList.add('soon'); nextSet = true; }
      }
    });
  }
  tick(); p._timer = setInterval(tick, 1000);
  body.append(el('<p class="small" style="padding:0.5rem 0.85rem 0.8rem;margin:0">Standard general-election closing times. Split states show the part that closes at each time. Confirm with the state office if a call depends on it.</p>'));
  return p;
}

function addLog(text, auto) {

function logPanel() {

      <button class="filter" aria-pressed="${R.mode === 'url'}" data-m="url">Web page</button>
    </div>
    <div id="mode"></div>
    <div class="row" style="margin-top:1rem;gap:1.2rem"><label class="row" style="gap:0.4rem;font-size:0.88rem">Refresh every <input type="number" min="15" step="5" value="${R.interval}" id="iv" style="width:5.5rem"> seconds</label><button class="btn sm" onclick="go('results')">Open the results section</button></div>
  </div>`);
  w.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { R.mode = b.dataset.m; save(); rebuildPanel('results'); applyView(); });
  $('#iv', w).onchange = e => { R.interval = Math.max(15, +e.target.value || 60); save(); rebuildPanel('results'); };
  const m = $('#mode', w);
  if (R.mode === 'civic') {
    const stateOpts = Object.entries(STATES).map(([k, n]) => `<option value="${k}" ${k === (S.finderState || 'MO') ? 'selected' : ''}>${n}</option>`).join('');
    m.append(el(`<div>
      <h3 style="margin-top:0.4rem">Tracked races <span class="small" id="rcount"></span></h3>
      <div class="chips" id="tracked"></div>
      <div class="row" style="margin-top:0.5rem"><button class="btn sm" id="rdef">Restore the default list</button><button class="btn sm danger" id="rclear">Clear all</button></div>
      <h3 style="margin-top:1.4rem">Find races</h3>
      <form class="row" id="findf">
        <select id="fstate" aria-label="State" style="width:auto;min-width:11rem">${stateOpts}</select>
        <input type="date" id="fdate" value="${esc(S.finderDate || ELECTION_DAY)}" aria-label="Election date" style="width:auto">
        <button class="btn primary sm">Load ballot</button>
        <label class="row small" style="gap:0.35rem;cursor:pointer"><input type="checkbox" id="flocal" ${S.finderLocal ? 'checked' : ''}> Include local races (slower)</label>
      </form>
      <div class="row" style="margin-top:0.6rem"><input type="text" id="ffilter" placeholder="Filter by name or type, e.g. Senate, Governor, House 5, Amendment" aria-label="Filter races" style="flex:1;min-width:12rem"></div>
      <div class="row" style="margin-top:0.5rem;gap:0.35rem"><span class="small">Quick filters:</span>${['US Senate', 'Governor', 'US House', 'Amendment', 'Proposition', 'Judicial'].map(q => `<button type="button" class="btn sm" data-q="${q}">${q}</button>`).join('')}<button type="button" class="btn sm" data-q="">All</button></div>
      <div id="findmsg" class="small" style="margin-top:0.4rem"></div>
      <div id="findlist" class="findlist"></div>
      <details style="margin-top:0.8rem"><summary class="small" style="cursor:pointer">Add by race ID instead</summary>
        <form class="row" id="addf" style="margin-top:0.5rem"><input type="text" id="rid" placeholder="civicAPI race ID or API link" style="flex:1;min-width:10rem"><input type="text" id="rlabel" placeholder="Label (optional)" style="flex:1;min-width:8rem"><button class="btn sm">Add</button></form>
        <div id="addmsg" class="small" style="margin-top:0.4rem"></div></details>
      <div class="note">civicAPI is a small free service and slows down on election night; the feed shows the last good numbers while it waits. Statewide party totals ("Missouri State House") show seats rather than votes until counts come in. Ballots you load are cached for six hours.</div>
    </div>`));
    const list = $('#findlist', m), fmsg = $('#findmsg', m), ffilter = $('#ffilter', m);
    let found = [];
    const added = () => new Set(R.races.map(r => String(r.id)));
    function refreshChips() {
      const c = $('#tracked', m); $('#rcount', m).textContent = R.races.length ? `(${R.races.length})` : '';
      c.innerHTML = R.races.map((r, i) => `<span class="chip">${r.pin ? icon('i-star-f') + ' ' : ''}${esc(r.label || r.id)}<button data-i="${i}" title="Remove">${icon('i-x')}</button></span>`).join('') || '<span class="small">No races yet. Find some below.</span>';
      c.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { R.races.splice(+b.dataset.i, 1); save(); refreshChips(); drawFound(); panels.get('results')?._reorder(); });
    }
    function drawFound() {
      const needle = ffilter.value.trim().toLowerCase(); const have = added();
      const rows = found.filter(r => !needle || `${r.election_name} ${r.type} ${r.district || ''}`.toLowerCase().includes(needle));
      list.innerHTML = '';
      if (!found.length) return;
      if (!rows.length) { list.append(el('<p class="small" style="padding:0.5rem 0">Nothing matches that filter.</p>')); return; }
      rows.slice(0, 150).forEach(r => {
        const on = have.has(String(r.id));
        const cands = (r.candidates || []).map(c => esc(c.name) + (c.party ? ` <span style="color:${partyColor(c.party)}">(${esc(String(c.party).slice(0, 3))})</span>` : '')).join(', ');
        const row = el(`<div class="findrow"><div><b>${esc(r.election_name)}</b><span class="small">${esc(r.type || '')}${r.district ? ' · ' + esc(r.district) : ''}${cands ? ' · ' + cands : ''}</span></div><button class="btn sm ${on ? '' : 'primary'}" ${on ? 'disabled' : ''}>${on ? 'Added' : 'Add'}</button></div>`);
        $('button', row).onclick = () => { R.races.push({ id: String(r.id), label: r.election_name }); save(); drawFound(); refreshChips(); const rp = panels.get('results'); if (rp) { rp._reorder(); rp._refresh(); } };
        list.append(row);
      });
      if (rows.length > 150) list.append(el(`<p class="small">Showing 150 of ${rows.length}. Narrow the filter to see the rest.</p>`));
    }
    refreshChips();
    $('#rdef', m).onclick = () => { const have = added(); DEFAULT_RACES.forEach(r => { if (!have.has(r.id)) R.races.push({ ...r }); }); save(); refreshChips(); drawFound(); const rp = panels.get('results'); if (rp) { rp._reorder(); rp._refresh(); } };
    $('#rclear', m).onclick = () => { R.races = []; save(); refreshChips(); drawFound(); panels.get('results')?._reorder(); };
    $('#findf', m).onsubmit = async e => {
      e.preventDefault();
      const st = $('#fstate', m).value, dt = $('#fdate', m).value || ELECTION_DAY, loc = $('#flocal', m).checked;
      S.finderState = st; S.finderDate = dt; S.finderLocal = loc; save();
      fmsg.textContent = loc ? 'Loading… local races can take a minute.' : 'Loading… (the service is slow on election night; this can take 20–30 seconds)'; list.innerHTML = ''; found = [];
      try {
        found = await searchRaces(st, dt, loc);
        const typeRank = t => /US Senate|^Senate$/i.test(t) ? 0 : /Governor/i.test(t) ? 1 : /US House|House of Rep/i.test(t) ? 2 : 5;
        found.sort((a, b) => a._tier - b._tier || typeRank(a.type) - typeRank(b.type) || String(a.type).localeCompare(String(b.type)) || String(a.election_name).localeCompare(String(b.election_name), undefined, { numeric: true }));
        const tiers = [0, 1, 2].map(t => found.filter(r => r._tier === t).length);
        fmsg.textContent = `${STATES[st]}, ${dt}: ${tiers[0]} federal, ${tiers[1]} statewide${loc ? `, ${tiers[2]} local` : ''} races.${loc ? '' : ' Tick the box to add local races.'}`;
        drawFound();
      } catch (err) { fmsg.innerHTML = `<span class="err">Could not load (${esc(err.message)}). Try again in a moment.</span>`; }
    };
    ffilter.oninput = drawFound;
    m.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { ffilter.value = b.dataset.q; drawFound(); });
    $('#addf', m).onsubmit = async e => {
      e.preventDefault();
      const raw = $('#rid', m).value.trim(); const mm = raw.match(/race\/(\d+)/); const id = mm ? mm[1] : raw.replace(/\/+$/, ''); if (!id) return;
      const msg = $('#addmsg', m); msg.textContent = 'Checking…';
      let label = $('#rlabel', m).value.trim();
      try { const d = await fetchRace(id); label = label || d.election_name?.en_US || d.election_name || ''; msg.textContent = 'Added ' + (label || id) + '.'; }
      catch (err) { msg.innerHTML = `<span class="err">Could not fetch that race yet (${esc(err.message)}). Added anyway; it will retry on each refresh.</span>`; }
      R.races.push({ id, label }); save(); refreshChips(); const rp = panels.get('results'); if (rp) { rp._reorder(); rp._refresh(); }
    };
  } else if (R.mode === 'embed') {
    m.append(el(`<div><label class="f">Results embed code</label><textarea id="emb" style="min-height:9rem" placeholder="Paste the widget code an outlet gives you">${esc(R.embed)}</textarea>
      <div class="row" style="margin-top:0.6rem"><button class="btn primary sm" id="saveEmb">Save</button></div></div>`));
    $('#saveEmb', m).onclick = () => { R.embed = $('#emb', m).value; save(); rebuildPanel('results'); toast('Saved', 'The results panel now shows your embed.'); };
  } else {
    m.append(el(`<div><label class="f">Results page address (reloads on the interval)</label><form class="row" id="uf"><input type="text" id="url" value="${esc(R.url)}" placeholder="https://…" style="flex:1;min-width:12rem"><button class="btn primary sm">Save</button></form></div>`));
    $('#uf', m).onsubmit = e => { e.preventDefault(); R.url = $('#url', m).value.trim(); save(); rebuildPanel('results'); toast('Saved', 'The results panel now shows that page.'); };
  }
  return w;
}
function setupLayout() {
  syncLayout();
  const L = S.layout;
  const w = el(`<div class="two"><div>
    <p class="lead">Turn panels on, size them in columns and rows, and drag to reorder. Changes apply the next time you open the dashboard; nothing reloads.</p>
    <div class="row" style="margin-bottom:0.8rem">
      <label class="row" style="gap:0.4rem;font-size:0.85rem">Columns <select id="cols">${[1, 2, 3, 4, 5, 6].map(n => `<option ${n == L.cols ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="row" style="gap:0.4rem;font-size:0.85rem">Row height <select id="rowh">${[180, 220, 240, 280, 320, 380].map(n => `<option value="${n}" ${n == L.rowh ? 'selected' : ''}>${n}px</option>`).join('')}</select></label>
    </div>
    <div class="row" style="margin-bottom:0.8rem"><span class="small">Presets:</span><button class="btn sm" data-p="default">Default</button><button class="btn sm" data-p="streams">Streams first</button><button class="btn sm" data-p="results">Results first</button><button class="btn sm" data-p="browsers">Browsers first</button></div>
    <div class="lay-list"></div>
    <div class="row" style="margin-top:0.9rem"><button class="btn primary" onclick="go('dashboard')">Open the dashboard</button></div>
   </div>
   <div class="card"><span class="tag">Preview</span><div class="preview" id="prev"></div></div></div>`);
  $('#cols', w).onchange = e => { L.cols = +e.target.value; save(); applyView(); };
  $('#rowh', w).onchange = e => { L.rowh = +e.target.value; save(); applyView(); };
  w.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    if (b.dataset.p === 'default') { L.cols = DEFAULT_LAYOUT.cols; L.rowh = DEFAULT_LAYOUT.rowh; L.panels = DEFAULT_LAYOUT.panels.map(p => ({ ...p })); syncLayout(); save(); applyView(); return; }
    const by = k => L.panels.filter(p => p.key.startsWith(k)); const one = k => L.panels.filter(p => p.key === k);
    const streams = by('stream-').map(p => ({ ...p, w: 1, h: 1 })), browsers = by('browser-').map(p => ({ ...p, w: Math.max(1, Math.floor(L.cols / 2)), h: 2 }));
    const results = one('results').map(p => ({ ...p, w: 1, h: 2, on: true })), wire = one('wire').map(p => ({ ...p, w: 1, h: 2, on: true })), closings = one('closings').map(p => ({ ...p, w: 1, h: 2 })), balance = one('balance').map(p => ({ ...p, w: 1, h: 2 })), log = one('log').map(p => ({ ...p, w: 1, h: 1 }));
    L.panels = { streams: [...streams, ...results, ...wire, ...closings, ...balance, ...log, ...browsers], results: [...results, ...wire, ...balance, ...closings, ...streams, ...log, ...browsers], browsers: [...browsers, ...results, ...wire, ...streams, ...closings, ...balance, ...log] }[b.dataset.p];
    save(); applyView();
  });
  const list = $('.lay-list', w);
  let dragFrom = null;
  L.panels.forEach((p, i) => {
    const sizeOpts = max => Array.from({ length: max }, (_, n) => n + 1);
    const empty = p.key.startsWith('stream') && !S.streams[+p.key.split('-')[1]]?.code;
    const it = el(`<div class="lay-item ${p.on ? '' : 'off'}" draggable="true">
      <span class="handle" title="Drag to reorder">${icon('i-grip')}</span>
      <label class="row" style="gap:0.5rem;cursor:pointer"><input type="checkbox" ${p.on ? 'checked' : ''}><span>${icon(panelIcon(p.key), 'ico kind')}${esc(panelName(p.key))}${empty ? ' <span class="small">(empty)</span>' : ''}</span></label>
      <select data-k="w" aria-label="Width in columns">${sizeOpts(6).map(n => `<option value="${n}" ${n == p.w ? 'selected' : ''}>${n} wide</option>`).join('')}</select>
      <select data-k="h" aria-label="Height in rows">${sizeOpts(4).map(n => `<option value="${n}" ${n == p.h ? 'selected' : ''}>${n} tall</option>`).join('')}</select>
      <span class="row nowrap" style="gap:0.15rem"><button class="btn sm" data-d="-1" aria-label="Move up">${icon('i-up')}</button><button class="btn sm" data-d="1" aria-label="Move down">${icon('i-down')}</button></span>
    </div>`);
    $('input', it).onchange = e => { p.on = e.target.checked; save(); applyView(); };
    it.querySelectorAll('select').forEach(s => s.onchange = () => { p[s.dataset.k] = +s.value; save(); applyView(); });
    it.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const j = i + +b.dataset.d; if (j < 0 || j >= L.panels.length) return; [L.panels[i], L.panels[j]] = [L.panels[j], L.panels[i]]; save(); applyView(); });
    it.addEventListener('dragstart', e => { dragFrom = i; it.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    it.addEventListener('dragend', () => { it.classList.remove('dragging'); list.querySelectorAll('.over').forEach(x => x.classList.remove('over')); });
    it.addEventListener('dragover', e => { e.preventDefault(); it.classList.add('over'); });
    it.addEventListener('dragleave', () => it.classList.remove('over'));
    it.addEventListener('drop', e => { e.preventDefault(); if (dragFrom == null || dragFrom === i) return; const [mv] = L.panels.splice(dragFrom, 1); L.panels.splice(i, 0, mv); save(); applyView(); });
    list.append(it);
  });
  const pv = $('#prev', w); pv.style.gridTemplateColumns = `repeat(${L.cols},1fr)`;
  L.panels.filter(p => p.on).forEach(p => { const d = document.createElement('div'); d.textContent = panelName(p.key); d.style.gridColumn = `span ${Math.min(p.w, L.cols)}`; d.style.gridRow = `span ${p.h}`; pv.append(d); });
  return w;
}
function setupBackup() {
  const w = el(`<div><p class="lead">Settings live in this browser only. Copy this text and paste it into the same box on another device to bring everything across, log included.</p>
    <textarea id="bk" style="min-height:14rem"></textarea>
    <div class="row" style="margin-top:0.6rem"><button class="btn sm" id="cp">${icon('i-copy')} Copy</button><button class="btn sm primary" id="ld">Load pasted settings</button><span class="spacer"></span><button class="btn sm" id="cc">Clear caches</button><button class="btn sm danger" id="rs">Reset everything</button></div>
    <div id="bkmsg" class="small" style="margin-top:0.6rem"></div></div>`);
  const ta = $('#bk', w); const { view, ...rest } = S; ta.value = JSON.stringify(rest, null, 1);
  $('#cp', w).onclick = async () => { try { await navigator.clipboard.writeText(ta.value); $('#bkmsg', w).textContent = 'Copied.'; } catch (e) { ta.select(); $('#bkmsg', w).textContent = 'Selected; copy it with the keyboard.'; } };
  $('#ld', w).onclick = () => { try { const n = JSON.parse(ta.value); localStorage.setItem(KEY, JSON.stringify(Object.assign(defaults(), n, { view: 'dashboard' }))); location.reload(); } catch (e) { $('#bkmsg', w).innerHTML = '<span class="err">That is not valid settings text.</span>'; } };
  $('#cc', w).onclick = () => { localStorage.removeItem(CACHE_KEY); if ('caches' in window) caches.keys().then(ks => ks.forEach(k => caches.delete(k))); $('#bkmsg', w).textContent = 'Caches cleared. Fresh data arrives on the next refresh.'; };
  let armed = false; $('#rs', w).onclick = e => { if (!armed) { armed = true; e.target.textContent = 'Click again to confirm'; return; } localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY); localStorage.removeItem(CACHE_KEY); location.reload(); };
  return w;
}

/* ---------- clock, ambient, boot ---------- */
function clock() { const d = new Date(); const local = timeStr(d), et = timeStr(d, ET); $('#clock').innerHTML = `<span><small>Local</small><b>${local}</b></span>` + (local !== et ? `<span><small>ET</small><b>${et}</b></span>` : ''); }
clock(); setInterval(clock, 1000);
if (!reduced && matchMedia('(pointer:fine)').matches) {
  const sp = $('.spotlight');
  addEventListener('pointermove', e => { sp.style.setProperty('--mx', e.clientX + 'px'); sp.style.setProperty('--my', e.clientY + 'px'); }, { passive: true });
}
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('/election/sw.js').catch(() => {}); }
(function init() {
  const h = location.hash.slice(1);
  if (VIEWS[h]) S.view = h; else if (!VIEWS[S.view]) S.view = 'dashboard';
  applyView();
  setTimeout(warmUp, 800);
})();
</script>
</body>
</html>
