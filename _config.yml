# Site settings. GitHub Pages builds this site with Jekyll.
title: Brianna Imm
collection_name: Papers & Projects
description: "Brianna R. Imm: J.D., law library professional, and MLIS student at the University of Missouri School of Law."
author: Brianna R. Imm
url: https://www.briannaimm.com
baseurl: ""
lang: en

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Papers and projects. Each file in _items/ becomes a page at /items/<file-name>/.
collections:
  items:
    output: true
    permalink: /items/:name/
  # Journal entries for /fm27-guides/manchester-united/. Each file in _fm27_journal/ shows in the Journal tab, newest first.
  fm27_journal:
    output: false

defaults:
  - scope:
      path: ""
      type: items
    values:
      layout: item

exclude:
  - README.md
  - DESIGN.md
  - LICENSE
  - LICENSE-CC-BY-4.0
  - editor/
  - missouri-results/tools/
  - missouri-results/README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  # Cloudflare Workers files (see cloudflare/README.md)
  - cloudflare/
  - wrangler.jsonc
  - .wrangler/
